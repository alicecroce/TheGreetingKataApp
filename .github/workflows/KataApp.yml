name: kata-app-workflow
run-name: ${{ github.actor}} is starting github actions

on:
    push:
      branches:
        - dev-alice


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

         # Step 2: Set up .NET SDK
      - name: Set up .NET Core SDK
        uses: actions/setup-dotnet@v4
        
        # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ./TheGreetingKataApp.sln

         # Step 4: Build the solution
      - name: Build the solution
        run: dotnet build ./TheGreetingKataApp.sln --configuration Release

      # Step 5: Run tests
      - name: Run tests
        run: dotnet test ./GreeterTests/GreeterTests.csproj 

        # Step 6: Run tests after code modifications
      - name: Run tests after code modifications
        run: dotnet test ./GreeterTests/GreeterTests.csproj 

        # Step 7: Run tests after code modifications
      - name: Run tests after code modifications
        run: dotnet test ./GreeterTests/GreeterTests.csproj 

        # Step 8: Run tests after code modifications
      - name: Run tests after code modifications
        run: dotnet test ./GreeterTests/GreeterTests.csproj 

      - name: Execute pack
        run: dotnet pack --configuration Release /p:PackageVersion=1.0.${{ github.run_number }}

      - name: Execute push
        run: |
        
          dotnet nuget add source \
            --username alicecroce \
            --password ${{ secrets.GREETING_KATA_TOKEN }} \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/alicecroce/index.json"

          dotnet nuget push "TheGreetingKataApp/bin/Release/TheGreetingKata.1.0.${{ github.run_number }}.nupkg" \
            --api-key ${{ secrets.GREETING_KATA_TOKEN }} \
            --source "github"
        